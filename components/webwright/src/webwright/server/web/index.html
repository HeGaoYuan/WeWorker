<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WeWorker 网站探索</title>
<link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">W</span><span>WeWorker 网站探索</span></div>
  <div class="topbar-status">
    <button id="activityStatus" class="status-pill status-button" hidden></button>
    <button id="browserStatus" class="status-pill status-button"></button>
    <button id="themeToggle" class="icon-btn" title="切换主题" aria-label="切换主题">◐</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="sidebar-tools">
      <label class="sidebar-search">
        <span aria-hidden="true">⌕</span>
        <input id="toolkitSearchInput" type="search" placeholder="搜索 Adapter 或 Tool…" autocomplete="off" />
      </label>
      <button class="btn btn-primary sidebar-create" id="newToolkitBtn">+ 新建 Adapter</button>
    </div>
    <div id="tree" class="tree"></div>
  </aside>
  <section class="main">
    <header class="workspace-header">
      <div class="workspace-context">
        <span class="workspace-context-label">当前上下文</span>
        <span id="workspaceContext" class="workspace-context-value">—</span>
      </div>
      <nav id="tabs" class="tabs" aria-label="Tool 工作区"></nav>
      <div class="publish-actions">
        <span class="export-progress" id="exportProgress"></span>
        <button class="btn btn-sm" id="exportToolkitBtn" disabled>导出 Adapter</button>
        <button class="btn btn-primary btn-sm" id="installToWeWorkerBtn" hidden disabled>安装到 WeWorker</button>
      </div>
    </header>
    <div id="workspace" class="workspace"></div>
  </section>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button type="button" id="lightboxClose" class="lightbox-close" aria-label="关闭截图预览">×</button>
  <img id="lightboxImage" alt="截图预览" />
</div>

<script type="module" src="/web/app.js"></script>
</body>
</html>
