name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  public-config:
    name: Public config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate public configuration
        run: node scripts/check-public-config.mjs

      - name: Test public configuration validator
        run: node --test scripts/__tests__/check-public-config.test.mjs

  webcli:
    name: WebCLI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webcli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webcli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weworker/backend-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weworker/backend-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

  renderer:
    name: Renderer build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weworker/renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weworker/renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: officialWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: officialWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  electron-integration:
    name: Electron integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weworker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weworker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:webwright-integration

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run tests
        run: >-
          node --test
          extension/test/exploration-site-state.test.mjs
          extension/test/sidepanel-workflow-navigation.test.mjs
          extension/test/tool-route.test.mjs
