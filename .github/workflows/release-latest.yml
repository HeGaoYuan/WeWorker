name: Release Latest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout WeWorker
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install Webwright Python
        run: uv python install 3.14.6

      - name: Verify native architecture
        shell: pwsh
        run: |
          if ((node -p process.arch) -ne 'x64') {
            throw 'Windows release runner must use x64 Node.js'
          }

      - name: Install Python build dependencies
        run: uv pip install --system pyinstaller pywin32

      - name: Install webcli dependencies
        working-directory: webcli
        run: npm ci

      - name: Install WeWorker dependencies
        working-directory: weworker
        run: npm ci

      - name: Install Renderer dependencies
        working-directory: weworker/renderer
        run: npm ci

      - name: Install Backend TS dependencies
        working-directory: weworker/backend-ts
        run: npm ci

      - name: Verify Webwright integration
        working-directory: weworker
        run: |
          npm run test:webwright-integration
          node scripts/ensure-webwright.cjs

      - name: Build Windows x64 installer
        working-directory: weworker
        run: npm run build:win

      - name: Verify packaged Webwright architecture
        shell: pwsh
        run: |
          $runtimeRoot = 'weworker/dist-app/win-unpacked/resources/webwright'
          $entrypoint = Join-Path $runtimeRoot 'Webwright.exe'
          $manifestPath = Join-Path $runtimeRoot 'webwright-runtime.json'
          if (-not (Test-Path $entrypoint -PathType Leaf)) {
            throw "Missing packaged Webwright entrypoint: $entrypoint"
          }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.platform -ne 'win32' -or $manifest.arch -ne 'x64' -or $manifest.mode -ne 'embedded') {
            throw "Unexpected packaged Webwright identity: $($manifest | ConvertTo-Json -Compress)"
          }

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            weworker/dist-app/*-win-x64.exe
            weworker/dist-app/*-win-x64.exe.blockmap
            weworker/dist-app/latest.yml
          if-no-files-found: error
          retention-days: 7

  build-mac:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            machine: arm64
            app_dir: mac-arm64
          - arch: x64
            runner: macos-15-intel
            machine: x86_64
            app_dir: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout WeWorker
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.31'
          enable-cache: true

      - name: Install Webwright Python
        run: uv python install 3.14.6

      - name: Verify native architecture
        shell: bash
        run: |
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Install webcli dependencies
        working-directory: webcli
        run: npm ci

      - name: Install WeWorker dependencies
        working-directory: weworker
        run: npm ci

      - name: Install Renderer dependencies
        working-directory: weworker/renderer
        run: npm ci

      - name: Install Backend TS dependencies
        working-directory: weworker/backend-ts
        run: npm ci

      - name: Verify Webwright integration
        working-directory: weworker
        run: |
          npm run test:webwright-integration
          node scripts/ensure-webwright.cjs

      - name: Build macOS ${{ matrix.arch }} installers
        working-directory: weworker
        run: npm run build:mac

      - name: Verify packaged Webwright architecture
        shell: bash
        run: |
          app_path="weworker/dist-app/${{ matrix.app_dir }}/WeWorker.app"
          webwright_path="$app_path/Contents/Resources/webwright/Webwright"
          test -x "$webwright_path"
          file "$webwright_path" | grep -q "${{ matrix.machine }}"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_info=$(codesign -dv --verbose=4 "$app_path" 2>&1)
          grep -q 'Signature=adhoc' <<< "$signature_info"
          grep -q 'TeamIdentifier=not set' <<< "$signature_info"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            weworker/dist-app/*-mac-${{ matrix.arch }}.dmg
            weworker/dist-app/*-mac-${{ matrix.arch }}.dmg.blockmap
            weworker/dist-app/*-mac-${{ matrix.arch }}.zip
            weworker/dist-app/*-mac-${{ matrix.arch }}.zip.blockmap
            weworker/dist-app/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: false

      - name: Assemble release assets
        shell: bash
        run: |
          mkdir -p dist/release
          cp dist/release-windows-x64/* dist/release/
          cp dist/release-macos-arm64/*.dmg* dist/release/
          cp dist/release-macos-arm64/*.zip* dist/release/
          cp dist/release-macos-x64/*.dmg* dist/release/
          cp dist/release-macos-x64/*.zip* dist/release/
          node weworker/scripts/merge-mac-update-metadata.cjs \
            dist/release-macos-arm64/latest-mac.yml \
            dist/release-macos-x64/latest-mac.yml \
            dist/release/latest-mac.yml

      - name: Validate release tag
        shell: bash
        run: |
          tag='${{ inputs.tag }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$tag" = "v$(node -p "require('./weworker/package.json').version")"

      - name: Create draft release
        run: |
          gh release create '${{ inputs.tag }}' \
            --title "WeWorker ${{ inputs.tag }}" \
            --generate-notes \
            --draft \
            dist/release/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
